<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>REALTIME DASHBOARD</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&display=swap" rel="stylesheet">

  <link rel="stylesheet" href="style.css">
</head>

<body>

  <!-- =========================
       LOGIN
  ========================== -->
  <section id="loginPage" class="login-page">

    <div class="login-box">

      <div class="logo">
        REALTIME
        <span>DASHBOARD</span>
      </div>

      <p class="login-subtitle">
        Login untuk mengakses dashboard
      </p>

      <form id="loginForm">

        <div class="input-group">
          <label>Email</label>
          <input
            type="email"
            id="email"
            placeholder="Masukkan email"
            required
          >
        </div>

        <div class="input-group">
          <label>Password</label>
          <input
            type="password"
            id="password"
            placeholder="Masukkan password"
            required
          >
        </div>

        <button type="submit" class="btn-primary">
          LOGIN
        </button>

      </form>

      <div id="loginMessage" class="message"></div>

    </div>

  </section>


  <!-- =========================
       DASHBOARD
  ========================== -->
  <section id="dashboardPage" class="dashboard-page hidden">

    <header class="topbar">

      <div>
        <h1>REALTIME DASHBOARD</h1>

        <div class="connection">
          <span id="connectionDot"></span>
          <span id="connectionText">Connecting...</span>
        </div>
      </div>

      <div class="user-area">

        <div class="user-info">
          <strong id="userEmail">-</strong>
          <small id="userRole">USER</small>
        </div>

        <button id="logoutBtn" class="btn-logout">
          LOGOUT
        </button>

      </div>

    </header>


    <main class="container">

      <!-- STAT -->
      <div class="stats">

        <div class="stat-card">
          <span>Total Data</span>
          <strong id="totalData">0</strong>
        </div>

        <div class="stat-card">
          <span>Data Aktif</span>
          <strong id="activeData">0</strong>
        </div>

        <div class="stat-card">
          <span>Status</span>
          <strong id="systemStatus">ONLINE</strong>
        </div>

      </div>


      <!-- ADD DATA -->
      <div class="panel">

        <div class="panel-title">
          <div>
            <h2>Simpan Data</h2>
            <p>Data langsung tersimpan ke Firebase</p>
          </div>
        </div>

        <form id="dataForm">

          <div class="form-grid">

            <div class="input-group">
              <label>Nama</label>
              <input
                type="text"
                id="dataName"
                placeholder="Nama"
                required
              >
            </div>

            <div class="input-group">
              <label>Data</label>
              <input
                type="text"
                id="dataValue"
                placeholder="Masukkan data"
                required
              >
            </div>

          </div>

          <button type="submit" class="btn-primary">
            SIMPAN DATA
          </button>

        </form>

        <div id="saveMessage" class="message"></div>

      </div>


      <!-- DATA LIST -->
      <div class="panel">

        <div class="panel-title">

          <div>
            <h2>Data Tersimpan</h2>
            <p>Perubahan akan muncul secara realtime</p>
          </div>

          <span id="dataCount" class="badge">
            0 DATA
          </span>

        </div>

        <div id="dataList" class="data-list">

          <div class="empty">
            Belum ada data.
          </div>

        </div>

      </div>

    </main>

  </section>


  <!-- Firebase -->
  <script type="module" src="app.js"></script>

</body>
</html>
